# Default values for kafka-connect-cluster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: kafka-system

image:
  repository: confluentinc/cp-kafka-connect
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "7.7.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::058264332540:role/KafkaConnectRole-hansu-eks
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: kafka-connect

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 8083

ingress:
  enabled: false

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 0.5
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /
    port: 8083
  initialDelaySeconds: 60
readinessProbe:
  httpGet:
    path: /
    port: 8083
  initialDelaySeconds: 60

autoscaling:
  minReplicas: 1
  maxReplicas: 100
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: kafka-system-plugin-volume
    persistentVolumeClaim:
      claimName: kafka-system-plugin-pvc
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /usr/share/java/kafka/plugins
    name: kafka-system-plugin-volume
    readOnly: true
  - mountPath: /etc/kafka-connect/jars
    name: kafka-system-plugin-volume
    subPath: kafka-jars
    readOnly: true
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

kafkaConnect:
  env:
    data:
      CONNECT_PLUGIN_PATH: "/usr/share/java/kafka,/usr/share/confluent-hub-components,/usr/share/java/kafka/plugins/aws-msk-auth-plugin,/usr/share/java/kafka/plugins/debezium-mysql-plugin,/usr/share/java/kafka/plugins/aws-secretsmanager-plugin,/usr/share/java/kafka/plugins/snowflake-plugin,/usr/share/java/kafka/plugins/custom-plugin"
      CONNECT_BOOTSTRAP_SERVERS: "b-3.hansumsk.2wxk5a.c2.kafka.ap-northeast-2.amazonaws.com:9098,b-1.hansumsk.2wxk5a.c2.kafka.ap-northeast-2.amazonaws.com:9098,b-2.hansumsk.2wxk5a.c2.kafka.ap-northeast-2.amazonaws.com:9098"
      CONNECT_SECURITY_PROTOCOL: "SASL_SSL"
      CONNECT_SASL_MECHANISM: "AWS_MSK_IAM"
      CONNECT_SASL_JAAS_CONFIG: "software.amazon.msk.auth.iam.IAMLoginModule required;"
      CONNECT_SASL_CLIENT_CALLBACK_HANDLER_CLASS: "software.amazon.msk.auth.iam.IAMClientCallbackHandler"
      CONNECT_PRODUCER_SECURITY_PROTOCOL: "SASL_SSL"
      CONNECT_PRODUCER_SASL_MECHANISM: "AWS_MSK_IAM"
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: "software.amazon.msk.auth.iam.IAMLoginModule required;"
      CONNECT_PRODUCER_SASL_CLIENT_CALLBACK_HANDLER_CLASS: "software.amazon.msk.auth.iam.IAMClientCallbackHandler"
      CONNECT_CONSUMER_SECURITY_PROTOCOL: "SASL_SSL"
      CONNECT_CONSUMER_SASL_MECHANISM: "AWS_MSK_IAM"
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: "software.amazon.msk.auth.iam.IAMLoginModule required;"
      CONNECT_CONSUMER_SASL_CLIENT_CALLBACK_HANDLER_CLASS: "software.amazon.msk.auth.iam.IAMClientCallbackHandler"
      CONNECT_CONFIG_PROVIDERS: "secretsmanager"
      CONNECT_CONFIG_PROVIDERS_SECRETSMANAGER_CLASS: "io.confluent.csid.config.provider.aws.SecretsManagerConfigProvider"
  plugin:
    pv:
      name: kafka-system-plugin-pv
      accessModes:
        - ReadOnlyMany
      storage: 10Gi
      mountOptions:
        - hard
        - nolock
      path: /hansu-kakfa-connector-plugin
      server: 10.0.0.4
    pvc:
      name: kafka-system-plugin-pvc
      accessModes:
        - ReadOnlyMany
      storage: 10Gi
      storageClassName: ""
